# Build the Vite site and publish it to GitHub Pages: on every push to main, once a day
# (to pick up edits made in the team's Notion page), and on demand ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 03:00 Taipei
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Jason 親選 / 最多人收聽 from the Notion page. Bad rows keep the last good lists; never blocks the build.
      - run: python scripts/sync_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # New episodes' YouTube videos from the channel's public feed (latest 15). Never blocks the build.
      - run: python scripts/fetch_youtube.py
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

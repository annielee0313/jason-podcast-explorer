# Copy yesterday's GA4 + Clarity numbers into the Notion table 網站數據.
# Runs at 00:30 Taipei (16:30 UTC) so Clarity's "last 24 hours" ≈ the day that just ended.
name: Site numbers to Notion

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet google-analytics-data
      - run: python scripts/sync_analytics.py
        env:
          NOTION_ANALYTICS_TOKEN: ${{ secrets.NOTION_ANALYTICS_TOKEN }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}

<!doctype html>
<!-- Weekly report email for 《Jason好好聊》. Email-safe: tables + inline styles, system fonts,
     no external CSS or images. Placeholders in {{double braces}} are filled by the sender script;
     {{kpis}}, {{done}}, {{next}}, {{asks}} are pre-rendered HTML rows/items. Brand: ink #1e2b33,
     teal-strong #0e7c86 (links), teal wash #d8f1f3, ground #f2f5f6. No border strokes. -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:#f2f5f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f5f6;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;color:#1e2b33;">
  <!-- header -->
  <tr><td style="padding:0 0 20px;">
    <span style="display:inline-block;background:#d8f1f3;padding:4px 10px;font-size:12px;letter-spacing:1.5px;font-family:'IBM Plex Mono',Menlo,monospace;">WEEKLY REPORT</span>
    <h1 style="margin:14px 0 4px;font-size:28px;font-weight:300;line-height:1.3;">Jason好好聊 · 網站週報</h1>
    <p style="margin:0;font-size:14px;color:#565c6a;">{{period}}</p>
  </td></tr>
  <!-- intro -->
  <tr><td style="background:#ffffff;padding:24px 28px;font-size:15px;line-height:1.8;">{{intro}}</td></tr>
  <tr><td style="height:12px;line-height:12px;font-size:0;">&nbsp;</td></tr>
  <!-- numbers -->
  <tr><td style="background:#ffffff;padding:24px 28px;">
    <p style="margin:0 0 14px;font-size:13px;letter-spacing:1px;color:#565c6a;">本週數字</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>{{kpis}}</tr></table>
    <p style="margin:14px 0 0;font-size:13px;line-height:1.7;color:#565c6a;">{{kpi_note}}</p>
  </td></tr>
  <tr><td style="height:12px;line-height:12px;font-size:0;">&nbsp;</td></tr>
  <!-- done / next -->
  <tr><td style="background:#ffffff;padding:24px 28px;font-size:15px;line-height:1.8;">
    <p style="margin:0 0 8px;font-size:13px;letter-spacing:1px;color:#565c6a;">已完成</p>
    <ul style="margin:0 0 20px;padding-left:20px;">{{done}}</ul>
    <p style="margin:0 0 8px;font-size:13px;letter-spacing:1px;color:#565c6a;">接下來</p>
    <ul style="margin:0;padding-left:20px;">{{next}}</ul>
  </td></tr>
  <tr><td style="height:12px;line-height:12px;font-size:0;">&nbsp;</td></tr>
  <!-- asks -->
  <tr><td style="background:#d8f1f3;padding:20px 28px;font-size:15px;line-height:1.8;">
    <p style="margin:0 0 6px;font-size:13px;letter-spacing:1px;">需要協助</p>
    <ul style="margin:0;padding-left:20px;">{{asks}}</ul>
  </td></tr>
  <!-- links + sign-off -->
  <tr><td style="padding:24px 4px 0;font-size:14px;line-height:1.8;">
    <a href="https://jasonstalk.com/" style="color:#0e7c86;">jasonstalk.com</a>　·　<a href="{{notion_url}}" style="color:#0e7c86;">Notion 後台</a><br>
    {{signoff}}
  </td></tr>
  <tr><td style="padding:24px 4px 0;font-size:12px;color:#565c6a;">數字來自 GA4 與 Microsoft Clarity，每晚自動寫入 Notion。訪客為每日加總。</td></tr>
</table>
</td></tr></table>
</body></html>
